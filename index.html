    <!--
      Tema antes da primeira pintura. Sem isto, quem escolheu o modo escuro vê
      um lampejo branco a cada carregamento, porque o React só aplica a classe
      depois de montar. É a mesma lógica de src/lib/tema.ts, propositalmente
      duplicada aqui: precisa rodar antes do bundle existir.
    -->
    <script>
      (function () {
        try {
          var escolha = localStorage.getItem('kolecta_tema');
          var escuro = escolha === 'escuro'
            || (escolha !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (escuro) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          }
        } catch (e) { /* storage bloqueado: fica no tema claro */ }
      })();
    </script>
